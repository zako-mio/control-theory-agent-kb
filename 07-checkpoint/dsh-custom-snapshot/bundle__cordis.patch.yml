            config:
              customSkillDirs: !!js (() => { const fs = process.getBuiltinModule('node:fs'); const dirs = ['/home/zako-mio/.dsh/skills/opencode']; const extra = '/home/zako-mio/.dsh/profiles/node_modules/@deepseek-ai/dsh-agent-preset/skills'; if (fs.existsSync(extra)) dirs.push(extra); return dirs })()
          - id: tool-skill
